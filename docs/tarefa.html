<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalhe da tarefa — Gestor de Tarefas</title>
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body data-page="task-detail">
  <header class="topbar">
    <span class="brand">Gestor de Tarefas</span>
    <nav aria-label="Principal">
      <a href="tarefas.html" data-testid="nav-tasks">Tarefas</a>
      <a href="nova-tarefa.html" data-testid="nav-new-task">Nova tarefa</a>
    </nav>
    <div class="user">
      <span data-testid="current-user"></span>
      <button type="button" class="link" data-testid="logout">Terminar sessão</button>
    </div>
  </header>
  <main>
    <section class="card" data-testid="task-not-found" hidden>
      <h1>Tarefa não encontrada.</h1>
      <p><a href="tarefas.html">Voltar às tarefas</a></p>
    </section>

    <section class="card" data-testid="task-detail" hidden>
      <div class="alert ok" role="status" data-testid="flash-message" hidden></div>
      <h1 data-testid="task-title"></h1>
      <dl>
        <dt>Descrição</dt><dd data-testid="task-description"></dd>
        <dt>Prioridade</dt><dd data-testid="task-priority"></dd>
        <dt>Estado</dt><dd><span data-testid="task-status"></span></dd>
        <dt>Data limite</dt><dd data-testid="task-due-date"></dd>
        <dt>Criada em</dt><dd data-testid="task-created-at"></dd>
      </dl>
      <div class="actions">
        <button type="button" class="primary" data-testid="task-start">Iniciar</button>
        <button type="button" class="primary" data-testid="task-complete">Concluir</button>
        <button type="button" data-testid="task-reopen">Reabrir</button>
        <button type="button" class="danger" data-testid="task-delete">Eliminar</button>
        <a href="tarefas.html" class="button" data-testid="task-back">Voltar</a>
      </div>
      <div class="confirm" role="alertdialog" aria-labelledby="confirm-text" data-testid="delete-confirmation" hidden>
        <p id="confirm-text">Tem a certeza que quer eliminar esta tarefa?</p>
        <div class="actions">
          <button type="button" class="danger" data-testid="delete-confirm">Confirmar eliminação</button>
          <button type="button" data-testid="delete-cancel">Cancelar</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
